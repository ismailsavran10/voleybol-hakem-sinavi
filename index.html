<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%20fill%3D%22%232563EB%22%2F%3E%3Cpath%20d%3D%22M12%202.8c-1.7%203.6-1.6%207.4.6%2010.6M21%2013c-3.9-.6-7.3.5-9.9%203.1M4.3%2017.3c2.1-3.4%202.6-7.2%201.2-10.9M12.6%2013.4c3.4%201.4%205.8%203.9%206.8%207%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Voleybol Hakem Sınavı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ulusal voleybol hakem sınavına hazırlık: FIVB 2025-2028 kuralları ve TVF MHGK belgelerinden doğrulanmış sorular, eksik analizi ve aralıklı tekrar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&display=swap">
<style>
/* Düzen: tek sütunlu odaklı çalışma alanı; DESIGN.md "Luminous Intelligence" token'ları (Plus Jakarta Sans, kobalt birincil, camgöbeği vurgu, beyaz kartlar soğuk zeminde). */
:root {
  --bg: #F5F7FB;
  --surface: #FFFFFF;
  --surface-2: #EFF4FF;
  --surface-3: #F8FAFC;
  --line: #E2E8F0;
  --hair: #EDF2F7;
  --text: #0F172A;
  --text-2: #475569;
  --muted: #64748B;
  --primary: #2563EB;
  --primary-2: #3B82F6;
  --primary-ink: #1D4ED8;
  --primary-soft: #EFF6FF;
  --on-primary: #FFFFFF;
  --cyan: #06B6D4;
  --good: #059669;
  --good-soft: #ECFDF5;
  --mid: #B45309;
  --mid-soft: #FFFBEB;
  --bad: #DC2626;
  --bad-soft: #FEF2F2;
  --na: #CBD5E1;
  --img-bg: #FFFFFF;
  --shadow-1: 0 8px 30px -4px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
  --shadow-2: 0 20px 40px -12px rgba(15, 23, 42, 0.16), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
  --focus: 0 0 0 3px rgba(37, 99, 235, 0.28);
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --r-card: 20px;
  --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1120; --surface: #111B2E; --surface-2: #16233D; --surface-3: #0E1728; --line: rgba(148, 163, 184, 0.18); --hair: rgba(148, 163, 184, 0.10);
    --text: #E7EEF9; --text-2: #B6C2D4; --muted: #8B9AB0; --primary: #3B82F6; --primary-2: #60A5FA; --primary-ink: #93C5FD; --primary-soft: rgba(59, 130, 246, 0.16); --on-primary: #FFFFFF;
    --cyan: #22D3EE; --good: #34D399; --good-soft: rgba(16, 185, 129, 0.14); --mid: #FBBF24; --mid-soft: rgba(245, 158, 11, 0.14); --bad: #F87171; --bad-soft: rgba(239, 68, 68, 0.14); --na: #334155;
    --img-bg: #F8FAFC; --shadow-1: 0 8px 30px -6px rgba(0, 0, 0, 0.45); --shadow-2: 0 24px 48px -12px rgba(0, 0, 0, 0.6); --focus: 0 0 0 3px rgba(96, 165, 250, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1120; --surface: #111B2E; --surface-2: #16233D; --surface-3: #0E1728; --line: rgba(148, 163, 184, 0.18); --hair: rgba(148, 163, 184, 0.10);
  --text: #E7EEF9; --text-2: #B6C2D4; --muted: #8B9AB0; --primary: #3B82F6; --primary-2: #60A5FA; --primary-ink: #93C5FD; --primary-soft: rgba(59, 130, 246, 0.16); --on-primary: #FFFFFF;
  --cyan: #22D3EE; --good: #34D399; --good-soft: rgba(16, 185, 129, 0.14); --mid: #FBBF24; --mid-soft: rgba(245, 158, 11, 0.14); --bad: #F87171; --bad-soft: rgba(239, 68, 68, 0.14); --na: #334155;
  --img-bg: #F8FAFC; --shadow-1: 0 8px 30px -6px rgba(0, 0, 0, 0.45); --shadow-2: 0 24px 48px -12px rgba(0, 0, 0, 0.6); --focus: 0 0 0 3px rgba(96, 165, 250, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; letter-spacing: -0.003em; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
h1 { font-size: clamp(26px, 4.2vw, 34px); line-height: 1.15; font-weight: 700; }
h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.good { color: var(--good); } .mid { color: var(--mid); } .low { color: var(--bad); } .na { color: var(--muted); }
:focus-visible { outline: none; box-shadow: var(--focus); }
svg { width: 18px; height: 18px; flex: none; }

.wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Üst çubuk */
#topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--hair); }
.topbar-in { display: flex; align-items: center; gap: 12px; min-height: 60px; padding-block: 8px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 4px 2px; font-weight: 700; font-size: 15.5px; letter-spacing: -0.015em; cursor: pointer; color: var(--text); border-radius: 10px; }
.brand svg { width: 26px; height: 26px; color: var(--primary); }
.tabs { display: flex; gap: 4px; background: var(--surface-3); border: 1px solid var(--hair); padding: 4px; border-radius: 999px; margin-left: auto; }
.tab { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.tab:hover { color: var(--text); }
.tab.on { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-1); }
.sync { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync.ok { color: var(--good); background: var(--good-soft); } .sync.warn { color: var(--mid); background: var(--mid-soft); } .sync.bad { color: var(--bad); background: var(--bad-soft); } .sync.na { color: var(--muted); background: var(--surface-3); }
@media (max-width: 640px) {
  .tabs { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
  .tab { flex: 1; padding: 7px 6px; }
  .sync { margin-left: auto; }
  .brand span { font-size: 14.5px; }
}

main.wrap { padding-block: 22px 72px; display: grid; gap: 18px; }
.page-head { display: grid; gap: 6px; padding-top: 6px; }
.lede { color: var(--text-2); max-width: 62ch; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }

/* Kartlar */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-1); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card.quiet { box-shadow: none; background: var(--surface-3); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }

/* Ana sayfa */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; align-items: end; padding-top: 6px; }
.hero-text { display: grid; gap: 8px; }
.stats3, .stats2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; box-shadow: var(--shadow-1); min-width: 0; }
.stat .k { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat b { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
.stat b small { font-size: 14px; color: var(--muted); font-weight: 600; }
.stat .s { font-size: 12px; color: var(--muted); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .modes { grid-template-columns: 1fr; } }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 18px 16px; display: grid; gap: 6px; cursor: pointer; box-shadow: var(--shadow-1); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; position: relative; overflow: hidden; }
.mode::after { content: ""; position: absolute; inset: auto -20% -60% auto; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--primary) 10%, transparent), transparent 70%); pointer-events: none; }
.mode:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--primary) 35%, var(--line)); }
.mode:disabled { opacity: .6; cursor: progress; }
.mode-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mode-title { font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
.mode-desc { color: var(--text-2); font-size: 14px; }
.mode-meta { font-size: 12.5px; color: var(--primary); font-weight: 600; }
.mode-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.pill.due { background: var(--bad); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 700; }

/* Satırlar ve çubuklar */
.rows { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 52px auto; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--hair); }
.row:first-child { border-top: 0; }
.rows.topics .row { grid-template-columns: 28px minmax(0, 1fr) 140px 52px auto; }
.row.rep { grid-template-columns: minmax(0, 1fr) auto; }
.row-main { display: grid; min-width: 0; }
.row-title { font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.row-sub { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.row-val { font-weight: 700; text-align: right; font-size: 14px; }
.bar { display: block; height: 8px; border-radius: 999px; background: var(--hair); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--na); }
.bar.good > span { background: var(--good); } .bar.mid > span { background: var(--mid); } .bar.low > span { background: var(--bad); }
.t-no { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); color: var(--primary-ink); font-size: 12.5px; font-weight: 700; }
@media (max-width: 640px) {
  .row, .rows.topics .row { grid-template-columns: minmax(0, 1fr) 46px auto; }
  .rows.topics .row { grid-template-columns: 26px minmax(0, 1fr) 46px auto; }
  .row .bar { grid-column: 1 / -1; grid-row: 2; }
  .rows.topics .row .bar { grid-column: 2 / -1; }
}

/* Butonlar ve çipler */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-ctl); border: 1px solid transparent; padding: 11px 18px; font-weight: 650; font-size: 14.5px; cursor: pointer; transition: transform .12s ease, background .12s ease, box-shadow .12s ease; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--primary) 70%, transparent); }
.btn.primary:hover:not(:disabled) { transform: scale(1.01); background: color-mix(in srgb, var(--primary) 90%, #000); }
.btn.soft { background: var(--primary-soft); color: var(--primary-ink); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { color: var(--text); border-color: color-mix(in srgb, var(--text) 25%, var(--line)); }
.btn.danger-soft { background: var(--bad-soft); color: var(--bad); }
.btn.warn-soft { background: var(--mid-soft); color: var(--mid); }
.btn svg { width: 16px; height: 16px; }
.link { background: none; border: 0; padding: 0; color: var(--primary); font-weight: 600; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
.link.report { color: var(--muted); }
.link.report:hover { color: var(--mid); }
.link svg { width: 15px; height: 15px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips, .presets, .focus { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-3); color: var(--text-2); cursor: pointer; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip.static { cursor: default; background: var(--surface-2); border-color: transparent; color: var(--primary-ink); padding: 4px 10px; font-size: 12.5px; }
.chip.static.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.chip.rule { cursor: default; background: var(--surface-2); color: var(--primary-ink); border-color: transparent; padding: 3px 9px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.gen { cursor: default; background: color-mix(in srgb, var(--cyan) 14%, transparent); color: color-mix(in srgb, var(--cyan) 70%, var(--text)); border-color: transparent; padding: 4px 10px; font-size: 12.5px; }
.chip.warn { cursor: default; background: var(--mid-soft); color: var(--mid); border-color: transparent; padding: 4px 10px; font-size: 12.5px; }
.chip.ok { cursor: default; background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip svg { width: 14px; height: 14px; }

/* Yapay zekâ küresi (DESIGN.md: chromatic AI orb) */
.orb { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; background: radial-gradient(circle at 32% 30%, #E0F2FE 0 14%, #60A5FA 38%, #2563EB 68%, #1D4ED8); box-shadow: 0 0 10px rgba(37, 99, 235, 0.45), inset 0 -1px 2px rgba(6, 182, 212, 0.6); }
.ai-note, .check.ai { font-size: 13px; color: var(--text-2); display: flex; gap: 8px; align-items: flex-start; background: var(--surface-3); border: 1px solid var(--hair); border-radius: 14px; padding: 10px 12px; }
.ai-note .orb, .check.ai .orb { margin-top: 4px; }
.ai-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.ai-chip.loading .orb { animation: pulse 1.4s ease-in-out infinite; }
.ai-chip.off .orb { filter: grayscale(1); opacity: .6; }
@keyframes pulse { 50% { transform: scale(.75); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .ai-chip.loading .orb { animation: none; } .mode, .btn { transition: none; } }

/* Kurulum penceresi */
#sheet { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet[hidden] { display: none !important; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.42); backdrop-filter: blur(2px); }
.sheet-panel { position: relative; width: min(560px, 100%); max-height: min(86vh, 760px); overflow: auto; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-2); padding: 22px; display: grid; gap: 14px; border: 1px solid var(--line); }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; position: sticky; bottom: -22px; background: var(--surface); padding-bottom: 2px; }
.field { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend { font-size: 13px; font-weight: 650; color: var(--text-2); padding: 0; margin-bottom: 2px; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper input { width: 96px; text-align: center; font: inherit; font-size: 20px; font-weight: 700; padding: 8px 10px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface-3); color: var(--text); }
.duration { display: flex; align-items: center; gap: 8px; color: var(--text-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.duration svg { color: var(--primary); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; flex: none; }
.chips .check { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; background: var(--surface-3); }
.check em { font-style: normal; color: var(--muted); font-size: 12px; }
.check small { display: block; color: var(--muted); font-size: 12px; }
.topic-list { display: grid; gap: 6px; max-height: 340px; overflow: auto; padding-right: 2px; }
.topic-opt { display: grid; grid-template-columns: auto 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--hair); border-radius: 12px; cursor: pointer; }
.topic-opt.on { border-color: var(--primary); background: var(--primary-soft); }
.topic-opt input { accent-color: var(--primary); margin: 0; }
.t-name { font-weight: 600; font-size: 14px; display: grid; min-width: 0; }
.t-name small { color: var(--muted); font-weight: 500; font-size: 12px; }
.t-rate { font-weight: 700; font-size: 13px; }

/* Test */
.view-test { max-width: 820px; }
.test { display: grid; gap: 14px; }
.test-head { display: flex; align-items: center; gap: 12px; }
.test-title { display: grid; flex: 1; min-width: 0; }
.test-title b { font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer, .counter { font-weight: 700; font-size: 18px; padding: 6px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.timer.low { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--bad-soft); }
.progress { height: 6px; background: var(--hair); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--cyan)); border-radius: inherit; transition: width .25s ease; }
.test-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-weight: 600; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-1); padding: 22px; display: grid; gap: 16px; min-width: 0; }
.qchips { display: flex; gap: 6px; flex-wrap: wrap; }
.qtext { font-size: 18px; line-height: 1.55; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; white-space: pre-line; }
.qline, .rv-q, .rule-qs li > p:first-child { white-space: pre-line; overflow-wrap: anywhere; }
.qimg { margin: 0; justify-self: center; background: var(--img-bg); border-radius: 18px; padding: 12px; border: 1px solid var(--line); }
.qimg img { display: block; max-height: 240px; width: auto; height: auto; max-width: 100%; }
.options { display: grid; gap: 10px; }
.options.tf { grid-template-columns: 1fr 1fr; }
.options.imgs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-3); cursor: pointer; font-size: 15px; line-height: 1.45; transition: border-color .12s ease, background .12s ease; min-width: 0; }
.opt:hover:not(:disabled) { border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); background: var(--surface); }
.opt:disabled { cursor: default; }
.opt-key { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 13px; color: var(--text-2); }
.opt-text { min-width: 0; overflow-wrap: anywhere; }
.options.imgs .opt { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
.options.imgs .opt img { background: var(--img-bg); border-radius: 10px; width: 100%; height: 150px; object-fit: contain; padding: 6px; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.sel .opt-key { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .opt-key { background: var(--good); color: #fff; border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt-key { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt.dim { opacity: .6; }
.blank { display: flex; align-items: center; gap: 10px; }
.blank input { flex: 1; min-width: 0; font: inherit; font-size: 20px; font-weight: 700; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-3); color: var(--text); }
.blank.right input { border-color: var(--good); background: var(--good-soft); }
.blank.wrong input { border-color: var(--bad); background: var(--bad-soft); }
.unit { font-weight: 700; color: var(--muted); }
.feedback { border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; border: 1px solid transparent; }
.feedback.ok { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 25%, transparent); }
.feedback.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
.fb-title { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; }
.feedback.ok .fb-title { color: var(--good); } .feedback.bad .fb-title { color: var(--bad); }
.fb-answer { font-size: 14.5px; }
.fb-exp { font-size: 14.5px; color: var(--text); max-width: 68ch; }
.fb-src { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gen-box { display: grid; gap: 8px; justify-items: start; border-top: 1px dashed color-mix(in srgb, var(--text) 18%, transparent); padding-top: 10px; }
.gen-box p { display: flex; gap: 8px; align-items: flex-start; color: var(--text-2); }
.gen-box .orb { margin-top: 4px; }
.report-form { display: grid; gap: 8px; }
.report-form textarea { font: inherit; font-size: 14px; border-radius: 12px; border: 1px solid var(--line); padding: 10px; background: var(--surface); color: var(--text); resize: vertical; width: 100%; }
.report-done { color: var(--mid); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.test-nav { display: flex; justify-content: space-between; gap: 10px; }
.test-nav .btn { min-width: 120px; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.pal { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; color: var(--text-2); }
.pal.done { background: var(--primary-soft); color: var(--primary-ink); border-color: transparent; }
.pal.cur { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); color: var(--text); }
.confirm { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow-2); }
@media (max-width: 640px) {
  .qcard { padding: 16px; border-radius: 20px; }
  .qtext { font-size: 16.5px; }
  .options.imgs .opt img { height: 120px; }
  .test-nav .btn { min-width: 0; flex: 1; }
}

/* Sonuç */
.result-hero { grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 22px; }
.ring { width: 150px; height: 150px; }
.ring-bg { fill: none; stroke: var(--hair); stroke-width: 11; }
.ring-fg { fill: none; stroke-width: 11; stroke-linecap: round; stroke: var(--na); }
.ring-fg.good { stroke: var(--good); } .ring-fg.mid { stroke: var(--mid); } .ring-fg.low { stroke: var(--bad); }
.ring-txt { font: 700 26px var(--font); fill: var(--text); font-variant-numeric: tabular-nums; }
.result-text { display: grid; gap: 8px; min-width: 0; }
.result-sub { color: var(--text-2); }
@media (max-width: 560px) { .result-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .result-text .row-actions { justify-content: center; } }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl.nums td.strong { font-weight: 650; }
.review-list { margin: 0; padding-left: 22px; display: grid; gap: 14px; }
.rv { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
.rv:last-child { border-bottom: 0; padding-bottom: 0; }
.rv-q { font-weight: 600; }
.rv-img { max-height: 130px; width: auto; background: var(--img-bg); border-radius: 12px; padding: 6px; border: 1px solid var(--line); justify-self: start; }
.rv-a { font-size: 14px; }
.rv-e { font-size: 14px; color: var(--text-2); max-width: 70ch; }

/* Analiz */
.rule-list { display: grid; gap: 8px; }
.rule { border: 1px solid var(--hair); border-radius: 14px; padding: 4px 12px; background: var(--surface-3); }
.rule[open] { background: var(--surface); border-color: var(--line); padding-bottom: 12px; }
.rule summary { display: grid; grid-template-columns: auto minmax(0, 1fr) 120px; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; list-style: none; }
.rule summary::-webkit-details-marker { display: none; }
.rule-txt { display: grid; min-width: 0; }
.rule-txt small { color: var(--muted); font-size: 12.5px; }
.rule-qs { list-style: none; margin: 4px 0 12px; padding: 0; display: grid; gap: 10px; }
.rule-qs li { display: grid; gap: 3px; padding: 10px; border-radius: 12px; background: var(--surface-3); }
@media (max-width: 560px) { .rule summary { grid-template-columns: auto minmax(0, 1fr); } .rule summary .bar { grid-column: 1 / -1; } }

/* Çalışma */
.seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; overflow-x: auto; }
.seg-btn { flex: 1; border: 0; background: none; padding: 9px 12px; border-radius: 10px; font-weight: 650; font-size: 13.5px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg-btn.on { background: var(--primary); color: var(--on-primary); }
.sum-list { display: grid; gap: 8px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
.sum[open] { padding-bottom: 14px; box-shadow: var(--shadow-1); }
.sum summary { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; list-style: none; }
.sum summary::-webkit-details-marker { display: none; }
.sum-t { display: grid; font-weight: 650; }
.sum-t small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.sum ul { list-style: none; margin: 4px 0 12px; padding: 0; display: grid; gap: 10px; }
.sum li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14.5px; }
.sum li .chip { margin-top: 2px; }
.changes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.change { gap: 8px; padding: 16px 18px; }
.change-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sig-h { margin-top: 6px; }

/* Soru havuzu */
.pool-head { display: grid; gap: 12px; }
.pool-head select { width: 100%; min-width: 0; font: inherit; font-size: 15px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.pool-dist { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.static.strong { background: var(--surface-2); color: var(--primary-ink); border-color: var(--primary); }
.pool-list { margin: 0; padding-left: 26px; display: grid; gap: 8px; }
.pool-list > li::marker { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.pool-q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.pool-q[open] { padding-bottom: 12px; box-shadow: var(--shadow-1); display: grid; gap: 8px; }
.pool-q summary { display: grid; gap: 6px; padding: 10px 0; cursor: pointer; list-style: none; font-weight: 600; line-height: 1.5; }
.pool-q summary::-webkit-details-marker { display: none; }
.pool-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pool-opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pool-opts li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--surface-3); font-size: 14px; overflow-wrap: anywhere; }
.pool-opts li.right { background: var(--good-soft); color: var(--good); font-weight: 650; }
.pool-opts li svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.old-reps { margin-top: 10px; }
.sig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.sig { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; box-shadow: var(--shadow-1); }
.sig-img { background: var(--img-bg); display: grid; place-items: center; height: 170px; padding: 10px; border-bottom: 1px solid var(--line); }
.sig-img img { max-height: 150px; width: auto; max-width: 100%; }
.sig figcaption { padding: 10px 12px 12px; display: grid; gap: 4px; justify-items: start; }
.sig-no { font-size: 12px; font-weight: 700; color: var(--primary); }

/* Bildirim */
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-2); opacity: 0; transition: opacity .2s ease, transform .2s ease; z-index: 60; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
